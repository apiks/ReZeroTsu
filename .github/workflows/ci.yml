name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: scripts/check.sh fmt
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: dead code
        run: scripts/deadcode.sh
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
